<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">AgentProvenance multi-agent evidence DAG</title>
  <desc id="desc">A causal graph from lead agent to sub-agents, peer message, tool call, kernel events, policy risk, response, artifact, manifest, and verification.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.node{fill:#fff;stroke:#cbd5e1;stroke-width:2}.agent{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.msg{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.sys{fill:#f8fafc;stroke:#64748b;stroke-width:2}.risk{fill:#fff7ed;stroke:#f97316;stroke-width:2}.bad{fill:#fef2f2;stroke:#ef4444;stroke-width:2}.ok{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.edge{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:6 6}.title{font:700 24px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.h{font:700 14px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.t{font:12px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}.label{font:700 11px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#2563eb}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1280" height="620"/>
  <text x="48" y="54" class="title">Signed evidence DAG: agent orchestration meets runtime ground truth</text>
  <text x="48" y="82" class="t">The graph records who delegated to whom, which message carried intent, which tool call ran, and which kernel event proved the effect.</text>

  <rect x="60" y="140" width="145" height="66" rx="14" class="agent"/>
  <text x="96" y="167" class="h">Lead agent</text>
  <text x="82" y="188" class="t">run scope / cgroup</text>
  <rect x="270" y="80" width="145" height="66" rx="14" class="agent"/>
  <text x="307" y="107" class="h">Alice</text>
  <text x="298" y="128" class="t">research sub-agent</text>
  <rect x="270" y="205" width="145" height="66" rx="14" class="agent"/>
  <text x="313" y="232" class="h">Bob</text>
  <text x="304" y="253" class="t">builder sub-agent</text>
  <rect x="60" y="300" width="145" height="66" rx="14" class="bad"/>
  <text x="96" y="327" class="h">recon</text>
  <text x="74" y="348" class="t">refused · no egress</text>

  <path class="edge" d="M205 170C230 145 245 116 270 113"/>
  <text x="220" y="128" class="label">agent_spawn</text>
  <path class="edge" d="M205 176C232 200 244 232 270 238"/>
  <text x="219" y="222" class="label">agent_spawn</text>
  <path class="edge" d="M132 206V300"/>
  <text x="140" y="258" class="label">agent_spawn</text>

  <rect x="480" y="80" width="210" height="66" rx="14" class="msg"/>
  <text x="510" y="107" class="h">Poisoned peer message</text>
  <text x="504" y="128" class="t">objectified body hash + preview</text>
  <path class="edge" d="M415 113H480"/>
  <text x="428" y="101" class="label">agent_message</text>
  <path class="edge" d="M585 146C552 184 454 223 415 235"/>

  <rect x="730" y="205" width="150" height="66" rx="14" class="node"/>
  <text x="772" y="232" class="h">Tool call</text>
  <text x="750" y="253" class="t">python setup.py install</text>
  <path class="edge" d="M415 238H730"/>
  <text x="520" y="228" class="label">agent_tool_call</text>

  <rect x="930" y="120" width="145" height="66" rx="14" class="bad"/>
  <text x="973" y="147" class="h">openat</text>
  <text x="951" y="168" class="t">~/.aws/credentials</text>
  <rect x="930" y="290" width="145" height="66" rx="14" class="bad"/>
  <text x="973" y="317" class="h">connect</text>
  <text x="949" y="338" class="t">169.254.169.254</text>
  <path class="edge" d="M880 235C908 210 915 165 930 153"/>
  <path class="edge" d="M880 242C910 260 910 315 930 323"/>
  <text x="888" y="220" class="label">agent_syscall</text>

  <rect x="1120" y="205" width="110" height="66" rx="14" class="risk"/>
  <text x="1151" y="232" class="h">Risk</text>
  <text x="1139" y="253" class="t">secret + metadata</text>
  <path class="edge" d="M1075 153C1102 166 1110 202 1120 219"/>
  <path class="edge" d="M1075 323C1104 308 1110 270 1120 255"/>

  <rect x="270" y="420" width="145" height="66" rx="14" class="ok"/>
  <text x="305" y="447" class="h">Artifact</text>
  <text x="292" y="468" class="t">hash / source refs</text>
  <rect x="520" y="420" width="145" height="66" rx="14" class="ok"/>
  <text x="555" y="447" class="h">Manifest</text>
  <text x="542" y="468" class="t">content-addressed</text>
  <rect x="770" y="420" width="145" height="66" rx="14" class="ok"/>
  <text x="806" y="447" class="h">Verify</text>
  <text x="792" y="468" class="t">hash / signature</text>
  <path class="edge dash" d="M805 271C760 350 470 375 415 420"/>
  <path class="edge" d="M415 453H520"/>
  <path class="edge" d="M665 453H770"/>

  <text x="48" y="565" class="t">Recorded facts and derived edges are distinct: hooks establish orchestration context; kernel events establish runtime ground truth; data-flow and taint edges are derived with confidence and evidence refs.</text>
</svg>
